# À placer dans .github/workflows/alertes.yml de ton dépôt GitHub (privé de préférence)
name: alertes
on:
  schedule:
    - cron: "*/20 * * * *"   # toutes les 20 min (doit correspondre à CRON_STEP)
  workflow_dispatch: {}       # lancement manuel possible
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Écrire creds.json depuis le secret
        run: echo '${{ secrets.GCP_CREDS }}' > creds.json
      - name: Lancer le bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          AWIN_FEED_NIKE: ${{ secrets.AWIN_FEED_NIKE }}
          AWIN_FEED_ZALANDO: ${{ secrets.AWIN_FEED_ZALANDO }}
          AWIN_FEED_FNAC: ${{ secrets.AWIN_FEED_FNAC }}
        run: python bot_alertes.py
